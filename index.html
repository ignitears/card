<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Expanded Unique Fonts for the Tarot Cards (Now with 33 Fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Cinzel+Decorative:wght@700&family=Creepster&family=Nosifer&family=Eater&family=Butcherman&family=MedievalSharp&family=Orbitron:wght@700&family=Oswald:wght@700&family=Playfair+Display:wght@700&family=Uncial+Antiqua&family=Kanit:wght@400;700&family=Chakra+Petch:wght@400;700&family=Mitr:wght@400;700&family=Rubik+Glitch&family=Audiowide&family=Grenze+Midnight&family=Pirata+One&family=Special+Elite&family=Black+Ops+One&family=Metal+Mania&family=Marcellus&family=Bodoni+Moda:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Bangers&family=Luckiest+Guy&family=Chewy&family=Anton&family=Alfa+Slab+One&family=Roboto:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- HTML2Canvas CDN for Exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #161616;
            --panel-bg: #2b2b2b;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #444444;
            --accent: #d4a000;
            --accent-hover: #ffcc00;
            --danger: #ff4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(212, 160, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 160, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- UI Elements: FABs & Modals --- */
        .fab {
            position: fixed;
            width: 50px;
            height: 50px;
            background: #000;
            border: 2px solid var(--accent);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .fab:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.1);
        }

        .top-left { top: 20px; left: 20px; }
        
        .fab-group.bottom-left {
            position: fixed;
            bottom: 60px;
            left: 40px;
            z-index: 1000;
        }
        
        .fab-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom left;
            position: absolute;
            bottom: 100%;
            left: 0;
            padding-bottom: 15px; 
        }
        .fab-group:hover .fab-actions {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        .fab-actions .action-btn { width: 160px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            padding: 30px;
            width: 450px;
            max-width: 90%;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }
        .modal-header h3 { color: var(--accent); letter-spacing: 2px; }

        /* --- Layout --- */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .preview-pane {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            perspective: 1500px;
        }

        .canvas-wrapper {
            transform-origin: center center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 2px var(--accent);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .tarot-canvas {
            width: 744px;
            height: 1039px;
            background: #000;
            position: relative;
            transform-style: preserve-3d;
        }

        .layer-element {
            position: absolute;
            transform-origin: center center;
            will-change: transform;
        }

        .editor-pane {
            width: 420px;
            background: var(--panel-bg);
            border-left: 2px solid var(--accent);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .editor-header {
            padding: 20px;
            border-bottom: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
            width: 100%;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #000;
            border: 1px solid var(--accent);
            z-index: 50;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .dropdown-menu.show { display: flex; }
        .dropdown-item {
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
        }
        .dropdown-item:hover {
            background: var(--accent);
            color: #000;
        }

        .layers-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .layers-container::-webkit-scrollbar { width: 6px; }
        .layers-container::-webkit-scrollbar-track { background: var(--bg-color); }
        .layers-container::-webkit-scrollbar-thumb { background: var(--border-color); }

        /* --- UI Controls --- */
        .action-btn {
            background: #000;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }
        .action-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 3px 3px 0px var(--text-main);
            transform: translate(-1px, -1px);
        }
        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* --- Layer Items --- */
        .layer-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        .layer-item:focus-within, .layer-item:hover {
            border-color: var(--accent);
        }

        .layer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            user-select: none;
        }
        .layer-title {
            font-weight: bold;
            font-size: 14px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .layer-controls { display: flex; gap: 8px; }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 2px 6px;
            transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--accent); }

        .layer-body {
            padding: 15px;
            border-top: 1px dashed var(--border-color);
            display: none;
        }
        .layer-body.open { display: block; }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group.full { grid-column: span 2; }
        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }
        .input-group label span.val { color: var(--accent); font-weight: bold; }

        input[type="text"], input[type="color"], select {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: var(--accent); }
        input[type="color"] { padding: 0; height: 34px; cursor: pointer; }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 8px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 12px;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px; border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: var(--border-color);
        }

        input[type="file"] {
            font-size: 12px; color: var(--text-main); background: #000;
            padding: 5px; border: 1px solid var(--border-color);
            cursor: pointer; width: 100%;
        }
        input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px; height: 16px; cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--accent); color: #000;
            padding: 12px 24px; font-weight: bold; font-size: 14px;
            border: 2px solid #fff; box-shadow: 4px 4px 0px #000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- FABs -->
    <button class="fab top-left" onclick="openSettings()">⚙️</button>

    <div class="fab-group bottom-left">
        <button class="fab">💾</button>
        <div class="fab-actions">
            <button class="action-btn" onclick="downloadTarot()">Download PNG</button>
            <button class="action-btn" onclick="saveProject()">Save JSON</button>
            <label class="action-btn" style="cursor:pointer; margin:0;">
                Load JSON
                <input type="file" accept=".json" style="display:none;" onchange="loadProject(this)">
            </label>
        </div>
    </div>

    <!-- Global Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>GLOBAL SETTINGS</h3>
                <button onclick="closeSettings()" class="icon-btn" style="font-size:24px;">×</button>
            </div>
            <div class="control-grid">
                <div class="input-group full">
                    <label>Card Background Color</label>
                    <input type="color" id="card_bgColor" value="#111111" oninput="updateCardSetting('bgColor', this.value)">
                </div>
                <div class="input-group full" style="flex-direction:row; align-items:center; gap:10px; margin-bottom: 5px;">
                    <input type="checkbox" id="card_tiltEnabled" onchange="updateCardSetting('tiltEnabled', this.checked)">
                    <label style="margin:0; text-transform:uppercase; font-size:12px; color:var(--accent);">Enable 3D Parallax Tilt</label>
                </div>
                <div class="input-group full" style="flex-direction:row; align-items:center; gap:10px; margin-bottom: 10px;">
                    <input type="checkbox" id="card_overflowHidden" checked onchange="updateCardSetting('overflowHidden', this.checked)">
                    <label style="margin:0; text-transform:uppercase; font-size:12px; color:var(--accent);">Clip to Card Bounds (Overflow)</label>
                </div>
                <div class="input-group full">
                    <label>Border Color</label>
                    <input type="color" id="card_borderColor" value="#d4a000" oninput="updateCardSetting('borderColor', this.value)">
                </div>
                <div class="input-group">
                    <label>Border Width <span class="val" id="val_card_borderWidth">4</span></label>
                    <input type="range" min="0" max="100" value="4" oninput="updateCardSetting('borderWidth', this.value)">
                </div>
                <div class="input-group">
                    <label>Corner Radius <span class="val" id="val_card_borderRadius">20</span></label>
                    <input type="range" min="0" max="200" value="20" oninput="updateCardSetting('borderRadius', this.value)">
                </div>
                <div class="input-group">
                    <label>Border Z-Index</label>
                    <div style="display: flex; align-items: center; gap: 10px; background: #000; border: 1px solid var(--border-color); padding: 5px;">
                        <button class="action-btn" style="width: 30px; padding: 5px;" onclick="updateBorderZ(-1)">▼</button>
                        <span class="val" id="val_card_borderZ" style="flex: 1; text-align: center; color: var(--accent); font-weight: bold; font-size: 16px;">0</span>
                        <button class="action-btn" style="width: 30px; padding: 5px;" onclick="updateBorderZ(1)">▲</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="app-container">
        <!-- LEFT: PREVIEW PANE -->
        <div class="preview-pane" id="preview-pane">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <div class="tarot-canvas" id="tarot-canvas">
                    <!-- Layers rendered here dynamically -->
                </div>
            </div>
        </div>

        <!-- RIGHT: EDITOR PANE -->
        <div class="editor-pane">
            <div class="editor-header">
                <div class="dropdown">
                    <button class="action-btn dropdown-toggle" onclick="toggleDropdown(event, 'add-layer-menu')">+ ADD LAYER</button>
                    <div class="dropdown-menu" id="add-layer-menu">
                        <button class="dropdown-item" onclick="addLayer('text')">Text</button>
                        <button class="dropdown-item" onclick="addLayer('image')">Image</button>
                        <button class="dropdown-item" onclick="addLayer('gradient')">Gradient</button>
                        <button class="dropdown-item" onclick="addLayer('box')">Box</button>
                    </div>
                </div>
            </div>
            
            <!-- Layer Accordions -->
            <div class="layers-container" id="layers-container"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Custom Rename Modal -->
    <div id="rename-modal" class="modal-overlay">
        <div class="modal-content" style="width: 350px;">
            <div class="modal-header">
                <h3>RENAME LAYER</h3>
                <button onclick="closeRenameModal()" class="icon-btn" style="font-size:24px;">×</button>
            </div>
            <div class="input-group">
                <label>NEW NAME</label>
                <input type="text" id="rename-input" style="font-size: 16px; padding: 10px;" onkeypress="if(event.key === 'Enter') submitRename()">
            </div>
            <button class="action-btn" style="margin-top: 20px; font-size: 16px; padding: 10px;" onclick="submitRename()">CONFIRM</button>
        </div>
    </div>

    <script>
        // --- CONSTANTS & DATA FOUNDATION ---
        const CANVAS_WIDTH = 744;
        const CANVAS_HEIGHT = 1039;
        
        // Expanded Font Library with Roman, Cartoony, Bold, and Standard styles
        const FONTS = [
            'Impact', 'Bebas Neue', 'Cinzel', 'Cinzel Decorative', 
            'Creepster', 'Nosifer', 'Eater', 'Butcherman', 'MedievalSharp', 'Orbitron', 'Oswald', 
            'Playfair Display', 'Uncial Antiqua', 'Kanit', 'Chakra Petch', 
            'Mitr', 'Rubik Glitch', 'Audiowide', 'Grenze Midnight', 
            'Pirata One', 'Special Elite', 'Black Ops One', 'Metal Mania',
            'Marcellus', 'Bodoni Moda', 'Cormorant Garamond',
            'Bangers', 'Luckiest Guy', 'Chewy',
            'Anton', 'Alfa Slab One',
            'Roboto', 'Montserrat'
        ];

        // State Array
        let layers = [];
        let layerCounter = 0;
        let cardSettings = { borderWidth: 4, borderColor: '#d4a000', borderRadius: 20, borderZ: 0, bgColor: '#111111', tiltEnabled: false, overflowHidden: true };

        // Parallax Data
        let targetRotateX = 0;
        let targetRotateY = 0;
        let currentRotateX = 0;
        let currentRotateY = 0;

        function getRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16) || 0;
            const g = parseInt(hex.slice(3, 5), 16) || 0;
            const b = parseInt(hex.slice(5, 7), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // --- UI TOGGLES ---
        function openSettings() { document.getElementById('settings-modal').classList.add('show'); }
        function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }

        function toggleDropdown(e, id) {
            e.stopPropagation();
            document.getElementById(id).classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-toggle')) {
                document.querySelectorAll(".dropdown-menu").forEach(menu => menu.classList.remove('show'));
            }
            if (event.target.matches('.modal-overlay')) {
                closeSettings();
                if (typeof closeRenameModal === 'function') closeRenameModal();
            }
        }

        function updateCardSetting(prop, val) {
            cardSettings[prop] = prop === 'overflowHidden' || prop === 'tiltEnabled' ? val : (prop === 'borderColor' || prop === 'bgColor' ? val : parseFloat(val));
            if (['borderWidth', 'borderRadius', 'borderZ'].includes(prop)) {
                document.getElementById('val_card_' + prop).innerText = val;
            }
            if (prop === 'tiltEnabled' && !val) resetParallax();
            renderCanvas();
            saveToLocal();
        }

        function saveToLocal() {
            const data = { cardSettings, layers, layerCounter };
            localStorage.setItem('tarot_proxy_autosave', JSON.stringify(data));
        }

        function loadFromLocal() {
            const saved = localStorage.getItem('tarot_proxy_autosave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.cardSettings && data.layers) {
                        cardSettings = data.cardSettings;
                        layers = data.layers;
                        layerCounter = data.layerCounter || layers.length;
                        
                        document.getElementById('card_borderColor').value = cardSettings.borderColor;
                        document.getElementById('card_bgColor').value = cardSettings.bgColor || '#111111';
                        document.getElementById('val_card_borderWidth').innerText = cardSettings.borderWidth;
                        document.getElementById('val_card_borderRadius').innerText = cardSettings.borderRadius;
                        document.getElementById('val_card_borderZ').innerText = cardSettings.borderZ || 0;
                        document.getElementById('card_tiltEnabled').checked = cardSettings.tiltEnabled || false;
                        document.getElementById('card_overflowHidden').checked = cardSettings.overflowHidden !== false;
                        
                        document.querySelector('input[oninput="updateCardSetting(\'borderWidth\', this.value)"]').value = cardSettings.borderWidth;
                        document.querySelector('input[oninput="updateCardSetting(\'borderRadius\', this.value)"]').value = cardSettings.borderRadius;

                        cardSettings.overflowHidden = cardSettings.overflowHidden !== false;
                        document.getElementById('card_overflowHidden').checked = cardSettings.overflowHidden;

                        if(!cardSettings.tiltEnabled) resetParallax();

                        renderEditor(); 
                        renderCanvas();
                    }
                } catch(err) {
                    console.error("Error loading local save", err);
                }
            }
        }

        function initApp() {
            loadFromLocal();
            scaleCanvas();
            window.addEventListener('resize', scaleCanvas);
            
            const pane = document.getElementById('preview-pane');
            pane.addEventListener('mousemove', handleParallaxMouse);
            pane.addEventListener('mouseleave', resetParallax);
            
            requestAnimationFrame(animateParallax);
        }

        function scaleCanvas() {
            const pane = document.getElementById('preview-pane');
            const wrapper = document.getElementById('canvas-wrapper');
            const scale = Math.min((pane.clientWidth - 100) / CANVAS_WIDTH, (pane.clientHeight - 100) / CANVAS_HEIGHT);
            
            if (!cardSettings.tiltEnabled) {
                wrapper.style.transform = `scale(${scale})`;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // --- LAYER MANAGEMENT ---
        function addLayer(type, overrides = {}) {
            layerCounter++;
            
            layers.forEach(l => l.isOpen = false);

            const id = `layer_${Date.now()}_${layerCounter}`;
            let layer = {
                id, type,
                name: `${type.toUpperCase()} ${layerCounter}`,
                visible: true,
                x: 0, y: 0, 
                w: CANVAS_WIDTH, h: CANVAS_HEIGHT,
                opacity: 1, rotation: 0,
                isOpen: true 
            };

            if (type === 'text') {
                layer.text = 'NEW TEXT'; layer.font = 'Impact'; layer.color = '#ffffff';
                layer.colorOpacity = 1; layer.outlineColor = '#000000'; layer.outlineOpacity = 1;
                layer.outlineSize = 4; layer.fontSize = 60; layer.h = 100;
                layer.imageFill = false; layer.fillImage = '';
            } else if (type === 'image') {
                layer.src = ''; layer.w = 400; layer.h = 400;
                layer.x = (CANVAS_WIDTH - 400) / 2; layer.y = (CANVAS_HEIGHT - 400) / 2;
                layer.borderRadius = 0; layer.blur = 0;
            } else if (type === 'box') {
                layer.w = 400; layer.h = 400; layer.x = (CANVAS_WIDTH - 400) / 2;
                layer.y = (CANVAS_HEIGHT - 400) / 2; layer.color = '#d4a000';
                layer.colorOpacity = 1; layer.borderRadius = 0; layer.imageFill = false;
                layer.fillImage = ''; layer.blur = 0; layer.borderWidth = 0; layer.borderColor = '#ffffff';
            } else if (type === 'gradient') {
                layer.color1 = '#d4a000'; layer.opacity1 = 1; layer.stop1 = 0;
                layer.color2 = '#000000'; layer.opacity2 = 1; layer.stop2 = 100;
                layer.angle = 180;
            }

            layer = { ...layer, ...overrides };
            layers.unshift(layer);
            
            renderEditor();
            renderCanvas();
            saveToLocal();
        }

        function deleteLayer(id) {
            layers = layers.filter(l => l.id !== id);
            renderEditor(); renderCanvas();
            saveToLocal();
        }

        let layerToRename = null;
        function renameLayer(id) {
            const l = layers.find(layer => layer.id === id);
            if (l) {
                layerToRename = l;
                document.getElementById('rename-input').value = l.name;
                document.getElementById('rename-modal').classList.add('show');
                setTimeout(() => document.getElementById('rename-input').focus(), 100);
            }
        }

        function closeRenameModal() {
            document.getElementById('rename-modal').classList.remove('show');
            layerToRename = null;
        }

        function submitRename() {
            if (layerToRename) {
                const newName = document.getElementById('rename-input').value;
                if (newName !== null && newName.trim() !== "") {
                    layerToRename.name = newName.trim();
                    renderEditor();
                    saveToLocal();
                }
            }
            closeRenameModal();
        }

        function updateBorderZ(delta) {
            let currentZ = cardSettings.borderZ || 0;
            updateCardSetting('borderZ', currentZ + delta);
        }

        function moveLayer(id, dir) {
            const idx = layers.findIndex(l => l.id === id);
            if (idx < 0) return;
            
            if (dir === 'up' && idx > 0) {
                const temp = layers[idx]; layers[idx] = layers[idx - 1]; layers[idx - 1] = temp;
            } else if (dir === 'down' && idx < layers.length - 1) {
                const temp = layers[idx]; layers[idx] = layers[idx + 1]; layers[idx + 1] = temp;
            }
            renderEditor(); renderCanvas();
            saveToLocal();
        }

        function toggleLayerBody(id) {
            const l = layers.find(l => l.id === id);
            if (l) {
                l.isOpen = !l.isOpen;
                document.getElementById(`body_${id}`).classList.toggle('open', l.isOpen);
                saveToLocal();
            }
        }

        window.updateVal = function(id, prop, value) {
            const l = layers.find(layer => layer.id === id);
            if (!l) return;
            if (['x', 'y', 'w', 'h', 'rotation', 'opacity', 'fontSize', 'outlineSize', 'angle', 'borderRadius', 'colorOpacity', 'outlineOpacity', 'opacity1', 'opacity2', 'stop1', 'stop2', 'blur', 'borderWidth'].includes(prop)) {
                l[prop] = parseFloat(value);
                const valDisplay = document.getElementById(`val_${id}_${prop}`);
                if (valDisplay) valDisplay.innerText = value;
            } else if (prop === 'visible' || prop === 'imageFill') {
                l[prop] = value; 
                if (prop === 'imageFill') renderEditor();
            } else {
                l[prop] = value;
            }
            renderCanvas();
            saveToLocal();
        };

        window.handleImageUpload = function(id, inputEl, targetProp = 'src') {
            const file = inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                updateVal(id, targetProp, e.target.result);
                if (targetProp === 'src') {
                    const img = new Image();
                    img.onload = function() {
                        updateVal(id, 'w', img.naturalWidth);
                        updateVal(id, 'h', img.naturalHeight);
                        renderEditor(); renderCanvas();
                    }
                    img.src = e.target.result;
                } else renderCanvas();
            }
            reader.readAsDataURL(file);
        };

        // --- RENDERING CANVAS ---
        function renderCanvas() {
            const canvas = document.getElementById('tarot-canvas');
            canvas.innerHTML = '';

            canvas.style.backgroundColor = cardSettings.bgColor;
            canvas.style.border = 'none';
            canvas.style.borderRadius = `${cardSettings.borderRadius}px`;
            
            if (cardSettings.overflowHidden) {
                canvas.style.overflow = 'visible';
                canvas.style.clipPath = `inset(0px round ${cardSettings.borderRadius}px)`;
            } else {
                canvas.style.overflow = 'visible';
                canvas.style.clipPath = 'none';
            }

            const reversed = [...layers].reverse();
            reversed.forEach((layer, idx) => {
                if (!layer.visible) return;

                const el = document.createElement('div');
                el.className = 'layer-element';
                el.style.zIndex = idx + 1;
                el.style.left = layer.x + 'px';
                el.style.top = layer.y + 'px';
                el.style.width = layer.w + 'px';
                el.style.height = layer.h + 'px';
                el.style.opacity = layer.opacity;
                
                const zDepth = cardSettings.tiltEnabled ? (idx + 1) * 40 : 0;
                el.style.transform = `rotate(${layer.rotation}deg) translateZ(${zDepth}px)`;

                if (layer.type === 'text') {
                    el.innerText = layer.text;
                    el.style.fontFamily = `'${layer.font}', sans-serif`;
                    el.style.fontSize = layer.fontSize + 'px';
                    
                    if (layer.imageFill && layer.fillImage) {
                        el.style.backgroundImage = `url(${layer.fillImage})`;
                        el.style.webkitBackgroundClip = 'text';
                        el.style.webkitTextFillColor = 'transparent';
                        el.style.backgroundSize = 'cover';
                        el.style.backgroundPosition = 'center';
                    } else {
                        el.style.color = getRgba(layer.color, layer.colorOpacity);
                        el.style.webkitTextFillColor = '';
                    }
                    
                    el.style.display = 'flex';
                    el.style.alignItems = 'center';
                    el.style.justifyContent = 'center';
                    el.style.textAlign = 'center';
                    el.style.webkitTextStroke = `${layer.outlineSize}px ${getRgba(layer.outlineColor, layer.outlineOpacity)}`;
                    el.style.paintOrder = 'stroke fill';
                } 
                else if (layer.type === 'image') {
                    if (layer.src) {
                        const img = document.createElement('img');
                        img.src = layer.src;
                        img.style.width = '100%'; img.style.height = '100%';
                        img.style.objectFit = 'fill'; 
                        img.style.borderRadius = layer.borderRadius + 'px';
                        if (layer.blur) img.style.filter = `blur(${layer.blur}px)`;
                        el.appendChild(img);
                    } else {
                        el.style.border = '2px dashed #555';
                        el.style.display = 'flex'; el.style.alignItems = 'center'; el.style.justifyContent = 'center';
                        el.style.color = '#555'; el.innerText = 'NO IMAGE';
                        el.style.borderRadius = layer.borderRadius + 'px';
                    }
                }
                else if (layer.type === 'box') {
                    el.style.backgroundColor = getRgba(layer.color, layer.colorOpacity);
                    if (layer.imageFill && layer.fillImage) {
                        el.style.backgroundImage = `url(${layer.fillImage})`;
                        el.style.backgroundSize = 'cover';
                        el.style.backgroundPosition = 'center';
                    }
                    el.style.borderRadius = layer.borderRadius + 'px';
                    if (layer.blur) el.style.filter = `blur(${layer.blur}px)`;
                    if (layer.borderWidth && layer.borderWidth > 0) el.style.border = `${layer.borderWidth}px solid ${layer.borderColor}`;
                }
                else if (layer.type === 'gradient') {
                    el.style.background = `linear-gradient(${layer.angle}deg, ${getRgba(layer.color1, layer.opacity1)} ${layer.stop1}%, ${getRgba(layer.color2, layer.opacity2)} ${layer.stop2}%)`;
                }

                canvas.appendChild(el);
            });

            const borderEl = document.createElement('div');
            borderEl.className = 'card-border-layer';
            borderEl.style.position = 'absolute';
            borderEl.style.top = '0'; borderEl.style.left = '0';
            borderEl.style.width = '100%'; borderEl.style.height = '100%';
            borderEl.style.pointerEvents = 'none';
            borderEl.style.boxSizing = 'border-box';
            borderEl.style.border = `${cardSettings.borderWidth}px solid ${cardSettings.borderColor}`;
            borderEl.style.borderRadius = `${cardSettings.borderRadius}px`;
            const bZDepth = cardSettings.tiltEnabled ? (cardSettings.borderZ || 0) * 10 : 0;
            borderEl.style.transform = `translateZ(${bZDepth}px)`;
            borderEl.style.zIndex = cardSettings.borderZ !== undefined ? cardSettings.borderZ : 10000;
            canvas.appendChild(borderEl);
        }

        // --- RENDERING EDITOR ---
        function renderEditor() {
            const container = document.getElementById('layers-container');
            container.innerHTML = '';

            layers.forEach((layer, index) => {
                const isTop = index === 0;
                const isBottom = index === layers.length - 1;
                const div = document.createElement('div');
                div.className = 'layer-item';
                
                const header = document.createElement('div');
                header.className = 'layer-header';
                header.innerHTML = `
                    <div class="layer-title">
                        <input type="checkbox" ${layer.visible ? 'checked' : ''} onclick="event.stopPropagation(); updateVal('${layer.id}', 'visible', this.checked)">
                        ${layer.name}
                        <button class="icon-btn" style="font-size:12px; margin-left: 5px;" onclick="event.stopPropagation(); renameLayer('${layer.id}')" title="Rename Layer">✏️</button>
                    </div>
                    <div class="layer-controls">
                        <button class="icon-btn" onclick="event.stopPropagation(); moveLayer('${layer.id}', 'up')" ${isTop ? 'disabled style="opacity:0.2"' : ''}>▲</button>
                        <button class="icon-btn" onclick="event.stopPropagation(); moveLayer('${layer.id}', 'down')" ${isBottom ? 'disabled style="opacity:0.2"' : ''}>▼</button>
                        <button class="icon-btn" style="color:var(--danger)" onclick="event.stopPropagation(); deleteLayer('${layer.id}')">✖</button>
                    </div>
                `;
                header.onclick = () => toggleLayerBody(layer.id);
                div.appendChild(header);

                const body = document.createElement('div');
                body.id = `body_${layer.id}`;
                body.className = `layer-body ${layer.isOpen ? 'open' : ''}`;
                
                let controlsHTML = `<div class="control-grid">`;
                const slider = (label, prop, min, max, step) => `
                    <div class="input-group ${['x','y','w','h'].includes(prop) ? 'full' : ''}">
                        <label>${label} <span class="val" id="val_${layer.id}_${prop}">${layer[prop]}</span></label>
                        <input type="range" min="${min}" max="${max}" step="${step}" value="${layer[prop]}" oninput="updateVal('${layer.id}', '${prop}', this.value)">
                    </div>
                `;
                const colorPicker = (label, colorProp, alphaProp) => `
                    <div class="input-group">
                        <label>${label} Color</label>
                        <input type="color" value="${layer[colorProp]}" oninput="updateVal('${layer.id}', '${colorProp}', this.value)">
                    </div>
                    ${slider(label + ' Opacity', alphaProp, 0, 1, 0.05)}
                `;
                const imageFillToggle = (label, prop) => `
                    <div class="input-group full" style="flex-direction:row; align-items:center; gap:10px; margin-top:10px; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);">
                        <input type="checkbox" ${layer[prop] ? 'checked' : ''} onchange="updateVal('${layer.id}', '${prop}', this.checked)">
                        <label style="margin:0; width:100%; display:flex; flex-direction:column; gap:8px;">
                            ${label}
                            ${layer[prop] ? `<input type="file" accept="image/*" onchange="handleImageUpload('${layer.id}', this, 'fillImage')">` : ''}
                        </label>
                    </div>
                `;

                controlsHTML += slider('X Pos', 'x', -1000, 2000, 1);
                controlsHTML += slider('Y Pos', 'y', -1000, 2000, 1);
                controlsHTML += slider('Width', 'w', 10, 2000, 1);
                controlsHTML += slider('Height', 'h', 10, 2000, 1);
                controlsHTML += slider('Layer Opacity', 'opacity', 0, 1, 0.01);
                controlsHTML += slider('Rotation', 'rotation', -180, 180, 1);

                if (layer.type === 'text') {
                    const fontOpts = FONTS.map(f => `<option value="${f}" ${layer.font===f ? 'selected' : ''} style="font-family:'${f}'">${f}</option>`).join('');
                    controlsHTML += `
                        <div class="input-group full">
                            <label>Text Content</label>
                            <input type="text" value="${layer.text}" oninput="updateVal('${layer.id}', 'text', this.value)">
                        </div>
                        <div class="input-group full">
                            <label>Font</label>
                            <select onchange="updateVal('${layer.id}', 'font', this.value)">${fontOpts}</select>
                        </div>
                        ${slider('Font Size', 'fontSize', 10, 2000, 1)}
                        ${slider('Outline Size', 'outlineSize', 0, 100, 1)}
                        ${colorPicker('Fill', 'color', 'colorOpacity')}
                        ${colorPicker('Outline', 'outlineColor', 'outlineOpacity')}
                        ${imageFillToggle('Image Fill / Mask', 'imageFill')}
                    `;
                } else if (layer.type === 'image') {
                    controlsHTML += `
                        <div class="input-group full">
                            <label>Upload Asset (PNG/JPG)</label>
                            <input type="file" accept="image/*" onchange="handleImageUpload('${layer.id}', this)">
                        </div>
                        ${slider('Border Radius', 'borderRadius', 0, 1000, 1)}
                        ${slider('Soft Edges (Blur)', 'blur', 0, 100, 1)}
                    `;
                } else if (layer.type === 'box') {
                    controlsHTML += `
                        ${colorPicker('Box Fill', 'color', 'colorOpacity')}
                        <div class="input-group">
                            <label>Border Color</label>
                            <input type="color" value="${layer.borderColor}" oninput="updateVal('${layer.id}', 'borderColor', this.value)">
                        </div>
                        ${slider('Border Width', 'borderWidth', 0, 100, 1)}
                        ${slider('Border Radius', 'borderRadius', 0, 1000, 1)}
                        ${slider('Soft Edges (Blur)', 'blur', 0, 100, 1)}
                        ${imageFillToggle('Image Fill / Mask', 'imageFill')}
                    `;
                } else if (layer.type === 'gradient') {
                    controlsHTML += `
                        ${colorPicker('Color 1', 'color1', 'opacity1')}
                        ${slider('Stop 1 %', 'stop1', 0, 100, 1)}
                        ${colorPicker('Color 2', 'color2', 'opacity2')}
                        ${slider('Stop 2 %', 'stop2', 0, 100, 1)}
                        ${slider('Gradient Angle', 'angle', 0, 360, 1)}
                    `;
                }

                controlsHTML += `</div>`;
                body.innerHTML = controlsHTML;
                div.appendChild(body);
                container.appendChild(div);
            });
        }

        // --- PARALLAX ANIMATION ---
        function handleParallaxMouse(e) {
            if (!cardSettings.tiltEnabled) return;
            const pane = document.getElementById('preview-pane');
            const rect = pane.getBoundingClientRect();
            
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            targetRotateX = ((y - centerY) / centerY) * -20; 
            targetRotateY = ((x - centerX) / centerX) * 20;
        }

        function resetParallax() {
            targetRotateX = 0; targetRotateY = 0;
            currentRotateX = 0; currentRotateY = 0;
            scaleCanvas();
        }

        function animateParallax() {
            if (cardSettings.tiltEnabled) {
                const pane = document.getElementById('preview-pane');
                const wrapper = document.getElementById('canvas-wrapper');
                
                currentRotateX += (targetRotateX - currentRotateX) * 0.1;
                currentRotateY += (targetRotateY - currentRotateY) * 0.1;

                const scale = Math.min((pane.clientWidth - 100) / CANVAS_WIDTH, (pane.clientHeight - 100) / CANVAS_HEIGHT);
                wrapper.style.transform = `scale(${scale}) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
            }
            requestAnimationFrame(animateParallax);
        }

        // --- EXPORT & LOGGING ---
        function downloadTarot() {
            showToast("GENERATING PNG... PLEASE WAIT");
            const wrapper = document.getElementById('canvas-wrapper');
            const canvasEl = document.getElementById('tarot-canvas');
            
            const origTilt = cardSettings.tiltEnabled;
            cardSettings.tiltEnabled = false;
            resetParallax();
            renderCanvas(); 

            const origTransform = wrapper.style.transform;
            const origTransition = wrapper.style.transition;
            wrapper.style.transition = 'none';
            wrapper.style.transform = 'none';

            setTimeout(() => {
                html2canvas(canvasEl, {
                    scale: 1, 
                    useCORS: true,
                    backgroundColor: null, 
                    logging: false
                }).then(canvas => {
                    wrapper.style.transition = origTransition;
                    wrapper.style.transform = origTransform;
                    cardSettings.tiltEnabled = origTilt;
                    renderCanvas(); 

                    const link = document.createElement('a');
                    link.download = `tarot_proxy_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("DOWNLOAD COMPLETE");
                }).catch(err => {
                    wrapper.style.transition = origTransition;
                    wrapper.style.transform = origTransform;
                    cardSettings.tiltEnabled = origTilt;
                    renderCanvas();
                    console.error(err);
                    showToast("ERROR GENERATING PNG");
                });
            }, 100);
        }

        window.saveProject = function() {
            const data = { cardSettings, layers, layerCounter };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `tarot_project_${Date.now()}.json`;
            link.click();
            showToast("PROJECT SAVED");
        };

        window.loadProject = function(inputEl) {
            const file = inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.cardSettings && data.layers) {
                        cardSettings = data.cardSettings;
                        layers = data.layers;
                        layerCounter = data.layerCounter || layers.length;
                        
                        document.getElementById('card_borderColor').value = cardSettings.borderColor;
                        document.getElementById('card_bgColor').value = cardSettings.bgColor || '#111111';
                        document.getElementById('val_card_borderWidth').innerText = cardSettings.borderWidth;
                        document.getElementById('val_card_borderRadius').innerText = cardSettings.borderRadius;
                        document.getElementById('val_card_borderZ').innerText = cardSettings.borderZ || 0;
                        document.getElementById('card_tiltEnabled').checked = cardSettings.tiltEnabled || false;
                        document.getElementById('card_overflowHidden').checked = cardSettings.overflowHidden !== false;
                        
                        document.querySelector('input[oninput="updateCardSetting(\'borderWidth\', this.value)"]').value = cardSettings.borderWidth;
                        document.querySelector('input[oninput="updateCardSetting(\'borderRadius\', this.value)"]').value = cardSettings.borderRadius;

                        cardSettings.overflowHidden = cardSettings.overflowHidden !== false;
                        document.getElementById('card_overflowHidden').checked = cardSettings.overflowHidden;

                        if(!cardSettings.tiltEnabled) resetParallax();

                        renderEditor(); renderCanvas(); scaleCanvas();
                        saveToLocal();
                        showToast("PROJECT LOADED");
                    }
                } catch(err) {
                    showToast("ERROR LOADING PROJECT");
                }
            };
            reader.readAsText(file);
            inputEl.value = ''; 
        };

        window.onload = initApp;
    </script>
</body>
